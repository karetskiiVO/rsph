[package]
name = "shaders"
version = "0.1.0"
edition = "2024"

[dependencies]
khal-std = "0.4.0"
# Для CUDA-бэкенда нужна версия с GitHub:
# khal-std = { git = "https://github.com/dimforge/khal" }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
khal = { version = "0.4.0", default-features = false, features = ["derive"] }
